<html>
    <head>
        <title>Card de Herói</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Card Geek</h1>

        <div class="card">

            <img src="https://upload.wikimedia.org/wikipedia/en/c/c7/Batman_Infobox.jpg">

            <h2>Batman</h2>

            <p class="tipo">Tipo: Herói</p>

            <p class="descricao">
            Bilionário Bruce Wayne combate o crime em Gotham City usando
            treinamento extremo, tecnologia avançada e sua inteligência.
            </p>

            <h3>Status</h3>

            <p>Vida</p>
            <div class="barra">
            <div class="vida"></div>
            </div>

            <p>Força</p>
            <div class="barra">
            <div class="forca"></div>
            </div>

            <p>Inteligência</p>
            <div class="barra">
            <div class="inteligencia"></div>
            </div>

            <p>Tecnologia</p>
            <div class="barra">
            <div class="tecnologia"></div>
            </div>

            <p>Agilidade</p>
            <div class="barra">
            <div class="agilidade"></div>
            </div>

            </div>
    </body>
</html>
